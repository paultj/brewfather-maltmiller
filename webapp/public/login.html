<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Brew Recipe Maker</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="card login-card">
    <div class="brand" style="margin-bottom:16px"><span class="brand-mark">🍺</span> Brew Recipe Maker</div>
    <form id="login-form">
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required autofocus>
      </div>
      <button class="btn primary" type="submit">Sign in</button>
      <div id="login-error" class="status bad hidden"></div>
    </form>
  </div>
  <script src="/login.js"></script>
</body>
</html>
