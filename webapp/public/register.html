<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join · Brew Recipe Maker</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="card login-card" style="max-width:440px">
    <div class="brand" style="margin-bottom:16px"><span class="brand-mark">🍺</span> Brew Recipe Maker</div>
    <div id="invite-problem" class="status bad hidden"></div>
    <form id="register-form" class="hidden">
      <p>You've been invited. Create your account, then add your own Anthropic and Brewfather keys in Settings.</p>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="new-password" minlength="10" required>
        <div class="help">At least 10 characters.</div>
      </div>
      <div class="field">
        <label for="password2">Password again</label>
        <input type="password" id="password2" autocomplete="new-password" minlength="10" required>
      </div>
      <button class="btn primary" type="submit">Create account</button>
      <div id="register-error" class="status bad hidden"></div>
    </form>
    <div class="auth-links"><a href="/login">Already have an account? Sign in</a></div>
  </div>
  <script src="/common.js"></script>
  <script src="/register.js"></script>
</body>
</html>
